name: Publish Zohar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: zohar-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Moriahise/Zohar'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Validate public export
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('site')
          assert (root/'index.html').is_file()
          assert not any(p.is_symlink() for p in root.rglob('*'))
          assert not any((root/p).exists() for p in ['content','redaktion','config','tools','reports'])
          for item in json.loads((root/'data/catalogue.json').read_text())['editions']:
              assert (root/'shiur'/item['id']/'index.html').is_file()
          PY
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
